/* ═══════════════════════════════════════════════════════════
   📡 العمل بدون إنترنت — طابور الإرسال + نسخة محلية خفيفة
   localStorage:
     sama_q_{uid}     → الرسائل المعلّقة  [{id,cid,to,toName,text,ts}]
     sama_cache_{uid} → {me, users{name,username}, friends, chats, msgs{cid:[{k,f,t,s}]}}   (بلا بريد ولا صور)
   • الرسالة تأخذ مفتاحاً ثابتاً قبل الإرسال ⇒ إعادة المحاولة لا تُكرّرها أبداً
   • الإرسال بالترتيب (FIFO) عند عودة الاتصال (online + .info/connected)
   ═══════════════════════════════════════════════════════════ */
let netUp = navigator.onLine, fbUp = null, netTimer = null, appOn = false;
let outQ = [], flushing = false, retryTimer = null, cacheTimer = null;
let lc = {users:{}, friends:{}, chats:{}, msgs:{}};        // النسخة المحلية في الذاكرة
let ld = {users:false, friends:false, chats:false};         // وصلت بيانات حيّة؟ (لا نمسح النسخة قبل ذلك)
let msgEls = {}, curMsgs = {};
const MSG_KEEP = 30, CHAT_KEEP = 12;

const qKey = ()=>"sama_q_" + me.uid, cKey = (u)=>"sama_cache_" + u;
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } }
function saveQ(){
  try{
    if(!outQ.length) localStorage.removeItem(qKey());
    else localStorage.setItem(qKey(), JSON.stringify(outQ.map(({id,cid,to,toName,text,ts})=>({id,cid,to,toName,text,ts}))));
  }catch{}
}
function loadLocal(){
  const raw = lsGet(qKey(), []);
  outQ = (Array.isArray(raw) ? raw : []).filter(x=>x && x.id && x.cid && x.to && x.text).map(x=>({...x, st:"wait"}));
  const c = lsGet(cKey(me.uid), null);
  lc = {users:{}, friends:{}, chats:{}, msgs:{}, ...(c || {})};
  ld = {users:false, friends:false, chats:false};
  msgEls = {}; curMsgs = {};
}
function hydrate(){                                          // عرض فوري من النسخة المحفوظة
  friendsSet = {...(lc.friends || {})};
  userChatsCache = {...(lc.chats || {})};
  usersCache = {};
  for(const id in (lc.users || {})) usersCache[id] = {name: lc.users[id].name, username: lc.users[id].username, photo: null};
  outQ.forEach(q=>{ userChatsCache[q.to] = {...(userChatsCache[q.to] || {}), text: q.text.slice(0,80), from: me.uid, ts: q.ts, name: q.toName}; });
  renderChats();
}
function wipeCache(){ appOn = false; clearTimeout(cacheTimer); if(me) try{ localStorage.removeItem(cKey(me.uid)); }catch{} }

function keepMsgs(){
  if(!chatId || !Object.keys(curMsgs).length) return;
  lc.msgs[chatId] = Object.values(curMsgs).sort((a,b)=>(a.s||0) - (b.s||0)).slice(-MSG_KEEP);
}
function scheduleCache(){ clearTimeout(cacheTimer); cacheTimer = setTimeout(writeCache, 900); }
function writeCache(){
  clearTimeout(cacheTimer);
  if(!me || !appOn) return;
  keepMsgs();
  const out = {v:1, me:{name: me.name, username: me.username, photo: me.photo || null}, users: lc.users || {}, friends: lc.friends || {}, chats: lc.chats || {}, msgs: lc.msgs || {}};
  if(ld.friends) out.friends = {...friendsSet};
  if(ld.chats){
    const ents = Object.entries(userChatsCache).filter(([,c])=>c && c.ts).sort((a,b)=>b[1].ts - a[1].ts).slice(0, 30);
    out.chats = Object.fromEntries(ents.map(([u,c])=>[u, {text: String(c.text||"").slice(0,80), from: c.from || "", ts: c.ts, name: c.name || "", unread: +c.unread || 0}]));
  }
  if(ld.users || ld.friends || ld.chats){
    const ids = new Set([...Object.keys(out.friends), ...Object.keys(out.chats), ...Object.keys(incomingMap)]);
    const u = {};
    ids.forEach(id=>{ const x = usersCache[id] || (lc.users || {})[id]; if(x && x.name) u[id] = {name: x.name, username: x.username || ""}; });
    out.users = u;
  }
  const lastS = (a)=>a && a.length ? (a[a.length-1].s || 0) : 0, ks = Object.keys(out.msgs);
  if(ks.length > CHAT_KEEP) ks.sort((a,b)=>lastS(out.msgs[b]) - lastS(out.msgs[a])).slice(CHAT_KEEP).forEach(k=>delete out.msgs[k]);
  lc = out;
  if(!lsSet(cKey(me.uid), out)){ out.msgs = {}; lsSet(cKey(me.uid), out); }     // الحصة ممتلئة: نحفظ بدون الرسائل
}

/* ── حالة الاتصال: online/offline + .info/connected ── */
function paintNet(){
  const p = $("netPill"); if(!p) return;
  p.classList.toggle("hidden", netUp || !me);
  p.textContent = "📡 بدون اتصال" + (outQ.length ? " · رسائل بانتظار الإرسال: " + outQ.length : " · تُعرض النسخة المحفوظة");
}
function evalNet(){
  const up = navigator.onLine && fbUp !== false;
  clearTimeout(netTimer);
  if(up === netUp) return;
  if(up) return setNet(true);
  netTimer = setTimeout(()=>setNet(false), navigator.onLine ? 2500 : 0);   // وميض قصير من Firebase لا يستحق تنبيهاً
}
function setNet(up){
  netUp = up; paintNet();
  if(!me) return;
  if(up){ toast("عاد الاتصال بالإنترنت", "ok", "🌐"); flushQueue(); }
  else toast("انقطع الاتصال — ستُحفظ رسائلك وتُرسل تلقائياً عند عودته", "info", "📡", 3800);
}
if(configured){
  db.ref(".info/connected").on("value", s=>{
    fbUp = s.val() === true; evalNet();
    if(fbUp && me && outQ.length) flushQueue();
  });
}
window.addEventListener("online",  ()=>{ try{ db.goOnline(); }catch{} evalNet(); });
window.addEventListener("offline", evalNet);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && me && outQ.length && netUp) flushQueue(); });

/* ── فقاعات الرسائل (محلية / معلّقة / مُرسلة) ── */
function scrollChat(){ const b = $("chatBody"); b.scrollTop = b.scrollHeight; }
function paintMsg(key, m, state){            // state: "wait" | "send" | "done" | "fail" | undefined (لا تغيير)
  const body = $("chatBody"), mine = m.from === me.uid;
  let b = msgEls[key]; const isNew = !b;
  if(isNew){
    b = el("div", "msg " + (mine ? "mine" : "theirs")); b.dataset.key = key;
    b.appendChild(document.createTextNode(m.text || ""));
    b._t = el("span","t"); b.appendChild(b._t);
    msgEls[key] = b;
  }else if(m.text != null && b.firstChild.nodeValue !== m.text) b.firstChild.nodeValue = m.text;
  const ts = Number(m.ts) || Date.now();
  b.dataset.ts = String(ts); b._t.textContent = fmtTime(ts);
  if(state){
    let st = b._s;
    if(!st){ st = b._s = el("span","qs"); b.appendChild(st); }
    clearTimeout(b._st);
    if(state === "done"){
      b.classList.remove("pending"); st.className = "qs ok"; st.textContent = "تم الإرسال ✓";
      b._st = setTimeout(()=>{ st.remove(); b._s = null; }, 3500);
    }else{
      b.classList.add("pending"); st.className = "qs";
      st.textContent = state === "wait" ? "بانتظار الاتصال ⏳" : state === "fail" ? "تعذّر الإرسال ✕" : "جارٍ الإرسال…";
    }
  }
  if(isNew){                                  // إدراج مرتّب بالزمن (النسخة المحلية ثم الحيّة بلا تكرار أو اختلال ترتيب)
    let c = body.lastElementChild;
    while(c && Number(c.dataset.ts) > ts) c = c.previousElementSibling;
    if(c) c.after(b); else body.prepend(b);
  }
  return isNew;
}
function paintQ(it, state){ if(chatId === it.cid) paintMsg(it.id, {from: me.uid, text: it.text, ts: it.ts}, state); }

/* ── الإرسال: مباشر أو طابور ── */
const isPerm = (e)=>/permission/i.test(((e && e.code) || "") + ((e && e.message) || ""));
function withTimeout(p, ms){
  return new Promise((res, rej)=>{
    const t = setTimeout(()=>rej(Object.assign(new Error("timeout"), {code:"timeout"})), ms);
    p.then(v=>{ clearTimeout(t); res(v); }, e=>{ clearTimeout(t); rej(e); });
  });
}
async function deliver(it, late){
  const TS = late ? it.ts : firebase.database.ServerValue.TIMESTAMP;     // المعلّقة تحتفظ بوقت كتابتها الأصلي
  await db.ref("chats/"+it.cid+"/messages/"+it.id).set({from: me.uid, text: it.text, ts: TS});
  pushNotif(it.to, "msg_"+me.uid, {type:"message", targetType:"chat", targetId:it.cid, text:it.text.slice(0,80)});
  const last = {text: it.text.slice(0, 80), from: me.uid, ts: TS};
  const mineP = "userChats/"+me.uid+"/"+it.to+"/", theirP = "userChats/"+it.to+"/"+me.uid+"/";
  db.ref().update({                                   // مسارات فرعية: لا نمسح عدّاد غير المقروء
    [mineP+"text"]: last.text, [mineP+"from"]: me.uid, [mineP+"ts"]: TS, [mineP+"name"]: it.toName,
    [theirP+"text"]: last.text, [theirP+"from"]: me.uid, [theirP+"ts"]: TS, [theirP+"name"]: me.name,
    [theirP+"unread"]: firebase.database.ServerValue.increment(1)
  }).catch(err=>console.warn("userChats:", err));
}
function enqueue(it){
  outQ.push(it); saveQ(); paintNet();
  paintQ(it, "wait"); if(chatId === it.cid) scrollChat();
  userChatsCache[it.to] = {...(userChatsCache[it.to] || {}), text: it.text.slice(0,80), from: me.uid, ts: it.ts, name: it.toName};
  renderChats(); scheduleCache();
}
function scheduleRetry(){ clearTimeout(retryTimer); retryTimer = setTimeout(flushQueue, 5000); }
async function flushQueue(){
  if(flushing || !me || !netUp || !outQ.length) return;
  flushing = true; clearTimeout(retryTimer);
  const owner = me.uid; let sent = 0;
  try{
    while(outQ.length && netUp && me && me.uid === owner){
      const it = outQ[0];
      it.st = "send"; paintQ(it, "send");
      try{ await withTimeout(deliver(it, true), 10000); }
      catch(e){
        if(isPerm(e)){ outQ.shift(); saveQ(); paintQ(it, "fail"); toast("تعذّر إرسال رسالة معلّقة إلى " + (it.toName || "المستخدم")); continue; }
        it.st = "wait"; paintQ(it, "wait"); break;                      // نعيد المحاولة لاحقاً بنفس الترتيب
      }
      outQ.shift(); saveQ(); paintQ(it, "done"); sent++;
    }
  }finally{ flushing = false; paintNet(); }
  if(outQ.length && netUp) scheduleRetry();
  if(sent) toast(sent === 1 ? "تم إرسال الرسالة المعلّقة ✓" : "تم إرسال " + sent + " رسائل معلّقة ✓", "ok", "✓");
}

/* إرسال رسالة (مشترك بين المحادثة والرد على الحالات) — يرجع "sent" أو "queued" */
async function sendMessageTo(otherUid, otherName, text){
  const cid = [me.uid, otherUid].sort().join("_");
  const it = {id: db.ref("chats/"+cid+"/messages").push().key, cid, to: otherUid, toName: otherName, text, ts: Date.now(), st: "wait"};
  if(!netUp || outQ.length){ enqueue(it); if(netUp) flushQueue(); return "queued"; }     // نحافظ على الترتيب
  try{ await withTimeout(deliver(it, false), 8000); return "sent"; }
  catch(e){
    if(isPerm(e)) throw e;
    enqueue(it); scheduleRetry(); return "queued";                      // فشل مؤقت → طابور (نفس المفتاح فلا تكرار)
  }
}

function openChat(otherUid, otherName){
  if(!friendsSet[otherUid]){              // المراسلة بين الأصدقاء فقط
    toast(relState(otherUid) === "sent" ? "بانتظار موافقة " + otherName + " على طلب الصداقة" : "أضف " + otherName + " كصديق أولاً لتتمكن من مراسلته", "info", "🔒");
    return;
  }
  closeChat();
  chatId = [me.uid, otherUid].sort().join("_");
  chatOther = {uid: otherUid, name: otherName};
  $("chatTitle").textContent = otherName;
  { const ca = $("chatAvatar"); ca.dataset.uid = otherUid; ca.dataset.fb = otherName; paintFor(ca); }
  $("chatBody").innerHTML = "";
  msgEls = {}; curMsgs = {};
  /* آخر الرسائل المحفوظة تظهر فوراً (حتى بدون اتصال) + الرسائل المعلّقة */
  ((lc.msgs && lc.msgs[chatId]) || []).forEach(x=>{ paintMsg(x.k, {from: x.f, text: x.t, ts: x.s}); curMsgs[x.k] = x; });
  outQ.filter(q=>q.cid === chatId).forEach(q=>paintMsg(q.id, {from: me.uid, text: q.text, ts: q.ts}, q.st === "send" ? "send" : "wait"));
  scrollChat();
  updateChatFriendBtn();
  $("chatPanel").classList.add("open");
  markRead("msg_"+otherUid); clearUnread(otherUid);

  chatRef = db.ref("chats/"+chatId+"/messages").orderByChild("ts").limitToLast(200);
  chatReady = false;
  chatRef.on("child_added", snap=>{
    const m = snap.val(); if(!m) return;
    const isNew = !msgEls[snap.key];
    if(chatReady && isNew && m.from !== me.uid) playSound("message");
    paintMsg(snap.key, m);
    curMsgs[snap.key] = {k: snap.key, f: m.from, t: String(m.text || "").slice(0, 500), s: m.ts || 0};
    scheduleCache(); scrollChat();
  }, err=>{ console.error(err); toast("تعذّر فتح المحادثة"); });
  { const my = chatRef; my.once("value").then(()=>{ if(chatRef === my) chatReady = true; }).catch(()=>{}); }
  setTimeout(()=>$("chatInput").focus(), 350);
}
function closeChat(){
  if(chatRef){ chatRef.off(); chatRef = null; }
  if(chatId){ keepMsgs(); scheduleCache(); }
  msgEls = {}; curMsgs = {};
  chatId = null; chatOther = null; chatReady = false;
  $("chatPanel").classList.remove("open");
}
$("chatBack").onclick = closeChat;

$("chatForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const text = $("chatInput").value.trim();
  if(!text || !chatId || !chatOther) return;
  const other = chatOther;
  playSound("send");
  $("chatInput").value = "";
  try{ await sendMessageTo(other.uid, other.name, text); }
  catch{ toast("تعذّر إرسال الرسالة"); }
});

/* ═══════════════════════════════════════════════════════════
   ✨ 5) الحالات (Stories) — نص / صورة / فيديو — تختفي بعد 24 ساعة
   البنية:
     stories/{id}                       → {uid, name, type:"text"|"image"|"video", text, bg | image | (mime,size,chunkCount), ts}
     storyChunks/{uid}/{id}/{00000..N}  → أجزاء الفيديو Base64 (150KB لكل جزء) — تُكتب قبل الميتا فيظهر الفيديو مكتملاً
     storyViews/{id}/{viewerUid}        → وقت المشاهدة (يقرؤها صاحب الحالة فقط)
     storyLikes/{id}/{viewerUid}        → true (إعجاب) — يقرؤها صاحب الحالة، وكل شخص يقرأ إعجابه فقط
   الحالات تظهر لك من أصدقائك فقط.
   ═══════════════════════════════════════════════════════════ */
const STORY_TTL = 24 * 3600 * 1000, STORY_MS = 5000;
const STORY_MAX_BYTES = 30 * 1024 * 1024;     // أقصى حجم فيديو للحالة
const CHUNK_RAW_BYTES = 115200;               // 115200 بايت خام = 153600 حرف Base64 ≈ 150KB لكل جزء
const UP_PARALLEL = 3;
const BGS = [
  "linear-gradient(135deg,#5e5ce6,#bf5af2)", "linear-gradient(135deg,#0a84ff,#30d5c8)",
  "linear-gradient(135deg,#ff375f,#ff9f0a)", "linear-gradient(135deg,#30c75e,#0a84ff)",
  "linear-gradient(135deg,#ff6482,#bf5af2)", "linear-gradient(135deg,#1d1d3a,#5e5ce6)",
  "linear-gradient(135deg,#ff9f0a,#ffd60a)", "linear-gradient(135deg,#32ade6,#5e5ce6)"
];
let storiesRef = null, storiesCache = {}, storiesByUser = {}, storyTimer = null, seen = {};
const vidCache = new Map();                    // storyId -> {p:Promise<url>, url}

const pad5 = (i)=>String(i).padStart(5, "0");
function mbStr(b){ return b >= 1048576 ? (b/1048576).toFixed(1) + "MB" : Math.max(1, Math.round(b/1024)) + "KB"; }
function guessMime(f){
  if(f.type && f.type.startsWith("video/")) return f.type;
  const e = (f.name || "").split(".").pop().toLowerCase();
  return ({mp4:"video/mp4", m4v:"video/mp4", mov:"video/quicktime", webm:"video/webm", "3gp":"video/3gpp", mkv:"video/x-matroska"})[e] || "video/mp4";
}
function safeMime(m){ return /^video\/[\w.+-]+$/.test(String(m || "")) ? m : "video/mp4"; }
function b64ToBytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
/* قراءة جزء من الملف كنص Base64 — لا يُحمَّل الملف كاملاً في الذاكرة */
function sliceToB64(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onerror = ()=>rej(new Error("تعذّر قراءة الفيديو من الجهاز، أعد اختياره ثم حاول مجدداً"));
    r.onload = ()=>{ const t = String(r.result); res(t.slice(t.indexOf(",") + 1)); };
    r.readAsDataURL(blob);
  });
}
async function withRetry(fn, tries){
  let last;
  for(let i = 0; i < (tries || 3); i++){
    try{ return await fn(); }
    catch(e){
      last = e;
      if(/permission/i.test(((e && e.code) || "") + ((e && e.message) || ""))) throw e;
      await new Promise(r=>setTimeout(r, 600 * (i + 1)));
    }
  }
  throw last;
}

/* جلب أجزاء الفيديو وتركيبها كـ Blob URL (مع تخزين مؤقت لتشغيل فوري عند الرجوع/التحميل المسبق) */
function getVideoURL(s){
  if(vidCache.has(s.id)) return vidCache.get(s.id).p;
  const n = s.chunkCount || 0;
  const p = (async ()=>{
    if(!n) throw new Error("no-data");
    const parts = new Array(n); let next = 0;
    const worker = async ()=>{
      while(next < n){
        const i = next++;
        const b64 = (await db.ref("storyChunks/"+s.uid+"/"+s.id+"/"+pad5(i)).once("value")).val();
        if(!b64) throw new Error("جزء ناقص رقم " + (i + 1));
        parts[i] = b64ToBytes(b64);
      }
    };
    await Promise.all(Array.from({length: Math.min(4, n)}, worker));
    return URL.createObjectURL(new Blob(parts, {type: safeMime(s.mime)}));
  })();
  const entry = {p, url: null};
  vidCache.set(s.id, entry);
  p.then(u=>{ entry.url = u; }).catch(()=>{ if(vidCache.get(s.id) === entry) vidCache.delete(s.id); });
  if(vidCache.size > 6){                       // لا نُبقي أكثر من 6 فيديوهات في الذاكرة
    const cur = sv && sv.list[sv.idx] ? sv.list[sv.idx].id : null;
    for(const k of vidCache.keys()){ if(k !== cur && k !== s.id){ dropVideo(k); break; } }
  }
  return p;
}
function dropVideo(id){ const e = vidCache.get(id); if(e && e.url) URL.revokeObjectURL(e.url); vidCache.delete(id); }
function clearVideos(){ for(const id of Array.from(vidCache.keys())) dropVideo(id); }

function seenKey(){ return "sama_seen_" + (me ? me.uid : ""); }
function loadSeen(){ try{ seen = JSON.parse(localStorage.getItem(seenKey()) || "{}") || {}; }catch{ seen = {}; } }
function saveSeen(){ try{ localStorage.setItem(seenKey(), JSON.stringify(seen)); }catch{} }
function hasUnseen(uid){
  if(me && uid === me.uid) return false;
  return (storiesByUser[uid] || []).some(s=>!seen[s.id]);
}

function rebuildStories(){
  if(!me) return;
  const now = Date.now(), by = {};
  for(const id in storiesCache){
    const s = storiesCache[id];
    if(!s || !s.uid || (s.ts || 0) < now - STORY_TTL) continue;
    if(s.uid !== me.uid && !friendsSet[s.uid]) continue;          // الأصدقاء فقط
    (by[s.uid] = by[s.uid] || []).push({...s, id});
  }
  for(const u in by) by[u].sort((a,b)=>(a.ts||0) - (b.ts||0));
  storiesByUser = by;
  const anyNew = Object.keys(by).some(u=>hasUnseen(u));
  $("navStDot").classList.toggle("hidden", !anyNew);
  refreshProfiles(); renderStatus(); renderProfile();
}
function listenStories(){
  stopStories(); loadSeen();
  storiesRef = db.ref("stories").orderByChild("ts").startAt(Date.now() - STORY_TTL);
  storiesRef.on("child_added",   s=>{ storiesCache[s.key] = s.val(); rebuildStories(); }, err=>console.warn("stories:", err.code || err));
  storiesRef.on("child_changed", s=>{ storiesCache[s.key] = s.val(); rebuildStories(); });
  storiesRef.on("child_removed", s=>{ delete storiesCache[s.key]; dropVideo(s.key); rebuildStories(); });
  storyTimer = setInterval(rebuildStories, 60000);
  // تنظيف حالات المستخدم المنتهية (بما فيها أجزاء الفيديو والإعجابات)
  db.ref("stories").orderByChild("ts").endAt(Date.now() - STORY_TTL).once("value").then(async snap=>{
    const mine = [];
    snap.forEach(c=>{ if((c.val() || {}).uid === me.uid) mine.push(c.key); });
    for(const id of mine){
      try{
        await Promise.all([db.ref("storyViews/"+id).remove(), db.ref("storyLikes/"+id).remove(), db.ref("storyChunks/"+me.uid+"/"+id).remove()].map(p=>p.catch(()=>{})));
        await db.ref("stories/"+id).remove();
      }catch{}
    }
  }).catch(()=>{});
}
function stopStories(){
  if(storiesRef){ storiesRef.off(); storiesRef = null; }
  if(storyTimer){ clearInterval(storyTimer); storyTimer = null; }
  closeViewer(true); closeComposer(true); clearVideos();
  storiesCache = {}; storiesByUser = {};
  $("navStDot").classList.add("hidden");
}

/* ── تبويب الحالات ── */
function storyRow(uid, list){
  const last = list[list.length - 1];
  const item = el("div","user-item glass");
  item.appendChild(avatarFor(uid, last.name));
  const info = el("div","grow");
  info.appendChild(nameFor(uid, last.name, "div", "nm"));
  info.appendChild(el("div","last", (last.type === "video" ? "🎞️ " : last.type === "image" ? "📷 " : "") + fmtTime(last.ts)));
  item.appendChild(info);
  item.onclick = ()=>openStories(uid);
  return item;
}
function renderStatus(){
  if(!me) return;
  const mine = storiesByUser[me.uid] || [];
  const av = $("stMeAv"); av.innerHTML = ""; av.appendChild(avatarFor(me.uid, me.name));
  $("stMeSub").textContent = mine.length ? mine.length + " حالة · آخرها " + fmtTime(mine[mine.length-1].ts) : "اضغط + لإضافة حالة تدوم 24 ساعة";
  const box = $("stList"); box.innerHTML = "";
  const others = Object.keys(storiesByUser).filter(u=>u !== me.uid);
  const latest = (u)=>storiesByUser[u][storiesByUser[u].length-1].ts || 0;
  const fresh = others.filter(hasUnseen).sort((a,b)=>latest(b)-latest(a));
  const old   = others.filter(u=>!hasUnseen(u)).sort((a,b)=>latest(b)-latest(a));
  if(fresh.length){ box.appendChild(sub("التحديثات الأخيرة")); fresh.forEach(u=>box.appendChild(storyRow(u, storiesByUser[u]))); }
  if(old.length){ box.appendChild(sub("تمت مشاهدتها")); old.forEach(u=>box.appendChild(storyRow(u, storiesByUser[u]))); }
  if(!others.length) box.appendChild(el("div","empty","لا توجد حالات من أصدقائك الآن ✨"));
}
$("stMe").addEventListener("click", ()=>{ if(storiesByUser[me.uid] && storiesByUser[me.uid].length) openStories(me.uid); else openComposer(); });
$("stAddBtn").addEventListener("click", e=>{ e.stopPropagation(); openComposer(); });

/* ── مُنشئ الحالة (نص / صورة / فيديو) ── */
let stMode = "text", stBg = 0, stImg = null, stVid = null, stVidURL = null, stBusy = false;
function freeVid(){
  const v = $("stVid"); try{ v.pause(); }catch{} v.removeAttribute("src"); v.load();
  if(stVidURL){ URL.revokeObjectURL(stVidURL); stVidURL = null; }
  stVid = null;
}
function setStBar(p){
  const b = $("stBar");
  if(p == null){ b.classList.add("hidden"); return; }
  b.classList.remove("hidden"); b.firstElementChild.style.width = Math.round(p * 100) + "%";
}
function paintComposer(){
  const m = stMode;
  $("stCanvas").style.background = m === "text" ? BGS[stBg] : "#000";
  $("stImg").classList.toggle("hidden", m !== "image");
  if(m === "image") $("stImg").src = stImg;
  const v = $("stVid"); v.classList.toggle("hidden", m !== "video");
  if(m === "video"){ if(v.getAttribute("src") !== stVidURL) v.src = stVidURL; v.play().catch(()=>{}); }
  else if(v.getAttribute("src")){ v.pause(); v.removeAttribute("src"); v.load(); }
  $("stText").classList.toggle("cap", m !== "text");
  $("stText").placeholder = m === "text" ? "اكتب حالتك…" : "أضف تعليقاً…";
  $("stBgBtn").classList.toggle("hidden", m !== "text");
  $("stModeText").classList.toggle("hidden", m === "text");
}
function openComposer(){
  freeVid(); stMode = "text"; stImg = null; stBg = Math.floor(Math.random() * BGS.length); stBusy = false;
  $("stText").value = ""; $("stPublish").disabled = false; $("stPublish").textContent = "نشر ➤"; setStBar(null);
  paintComposer(); $("stComp").classList.remove("hidden");
  setTimeout(()=>$("stText").focus(), 200);
}
function closeComposer(force){
  if(stBusy && !force){ toast("انتظر اكتمال الرفع…", "info", "⏳"); return; }
  $("stComp").classList.add("hidden"); stImg = null; $("stImg").removeAttribute("src");
  freeVid(); setStBar(null);
}
$("stCancel").onclick = ()=>closeComposer();
$("stBgBtn").onclick = ()=>{ stBg = (stBg + 1) % BGS.length; paintComposer(); };
$("stModeText").onclick = ()=>{ if(stBusy) return; freeVid(); stMode = "text"; stImg = null; paintComposer(); $("stText").focus(); };
$("stFile").addEventListener("change", async (e)=>{
  const f = e.target.files[0]; e.target.value = "";
  if(!f || stBusy) return;
  if(!f.type.startsWith("image/")){ toast("اختر ملف صورة فقط"); return; }
  if(f.size > 20*1024*1024){ toast("الصورة كبيرة جداً (الحد 20MB)"); return; }
  try{ freeVid(); stImg = await fileToBase64(f); stMode = "image"; paintComposer(); }
  catch{ toast("تعذّر قراءة الصورة"); }
});
$("stVidFile").addEventListener("change", (e)=>{
  const f = e.target.files[0]; e.target.value = "";
  if(!f || stBusy) return;
  if(!(f.type || "").startsWith("video/") && !/\.(mp4|m4v|mov|webm|3gp|mkv)$/i.test(f.name || "")){ toast("اختر ملف فيديو فقط"); return; }
  if(f.size > STORY_MAX_BYTES){ toast("الفيديو كبير (" + mbStr(f.size) + ") — الحد " + mbStr(STORY_MAX_BYTES) + "، اختر مقطعاً أقصر"); return; }
  freeVid(); stImg = null;
  stVid = f; stVidURL = URL.createObjectURL(f); stMode = "video"; paintComposer();
  toast(mbStr(f.size) + " — جاهز للنشر", "info", "🎞️");
});
$("stPublish").onclick = async ()=>{
  if(stBusy) return;
  if(!netUp){ toast("النشر يحتاج اتصالاً بالإنترنت", "err", "📡"); return; }
  const text = $("stText").value.trim();
  if(stMode === "text" && !text){ toast("اكتب شيئاً أولاً"); return; }
  if(stMode === "image" && !stImg){ toast("اختر صورة أولاً"); return; }
  if(stMode === "video" && !stVid){ toast("اختر فيديو أولاً"); return; }
  stBusy = true; $("stPublish").disabled = true; $("stPublish").textContent = "جارٍ النشر…";
  const ref = db.ref("stories").push(), id = ref.key;
  const TS = firebase.database.ServerValue.TIMESTAMP;
  try{
    if(stMode === "video"){
      const file = stVid, n = Math.max(1, Math.ceil(file.size / CHUNK_RAW_BYTES));
      let next = 0, done = 0, aborted = false;
      setStBar(0);
      const worker = async ()=>{
        while(!aborted && next < n){
          const i = next++;
          try{
            const b64 = await sliceToB64(file.slice(i * CHUNK_RAW_BYTES, (i + 1) * CHUNK_RAW_BYTES));
            await withRetry(()=>db.ref("storyChunks/"+me.uid+"/"+id+"/"+pad5(i)).set(b64));
          }catch(e){ aborted = true; throw e; }
          done++; setStBar(done / n);
          $("stPublish").textContent = "جارٍ الرفع " + Math.round(done / n * 100) + "%";
        }
      };
      const res = await Promise.allSettled(Array.from({length: Math.min(UP_PARALLEL, n)}, worker));
      const bad = res.find(r=>r.status === "rejected");
      if(bad) throw bad.reason;
      $("stPublish").textContent = "جارٍ إنهاء النشر…";
      await withRetry(()=>ref.set({uid: me.uid, name: me.name, type: "video", text, mime: guessMime(file), size: file.size, chunkCount: n, ts: TS}));
    }else{
      const data = {uid: me.uid, name: me.name, type: stMode, text, ts: TS};
      if(stMode === "image") data.image = stImg; else data.bg = stBg;
      await ref.set(data);
    }
    stBusy = false; closeComposer(true); playSound("send"); toast("تم نشر حالتك", true);
  }catch(err){
    console.error(err);
    db.ref("storyChunks/"+me.uid+"/"+id).remove().catch(()=>{});          // تنظيف ما رُفع من أجزاء
    const code = (err && err.code) || "", msg = (err && err.message) || "";
    toast(/permission/i.test(code + msg) ? "القواعد لا تسمح بالنشر — انشر قواعد stories و storyChunks (Rules ← Publish)" : "فشل النشر، حاول مرة أخرى");
    $("stPublish").disabled = false; $("stPublish").textContent = "إعادة المحاولة"; setStBar(null);
  }finally{ stBusy = false; }
};

/* ── عارض الحالات ── */
let sv = null, svViewsRef = null, svLikesRef = null, svMyLikeRef = null, tapAt = 0, tapTimer = null, svViewers = {}, svLikes = {}, svMuted = false, svTok = 0, svLiked = false;
function openStories(uid, sid){
  const list = storiesByUser[uid];
  if(!list || !list.length) return;
  let idx = 0;
  if(sid){ const f = list.findIndex(s=>s.id === sid); if(f >= 0) idx = f; }
  else if(uid !== me.uid){ const f = list.findIndex(s=>!seen[s.id]); idx = f < 0 ? 0 : f; }
  const queue = [uid, ...Object.keys(storiesByUser).filter(u=>u !== uid && u !== me.uid && hasUnseen(u))];
  sv = {uid, list: list.slice(), idx, queue, qi: 0, elapsed: 0, last: 0, holds: 0, raf: 0, sheet: false, typing: false, vid: null, vready: false, vfail: false, tryT: 0};
  $("sv").classList.remove("hidden");
  showStory();
}
function svPaused(){ return sv && (sv.holds > 0 || sv.sheet || sv.typing || document.hidden || $("dlg").classList.contains("open")); }
function detachViews(){
  if(svViewsRef){ svViewsRef.off(); svViewsRef = null; }
  if(svLikesRef){ svLikesRef.off(); svLikesRef = null; }
  if(svMyLikeRef){ svMyLikeRef.off(); svMyLikeRef = null; }
  svViewers = {}; svLikes = {};
}
function paintLike(beat){
  const b = $("svLike");
  b.textContent = svLiked ? "❤️" : "🤍";
  b.classList.toggle("liked", svLiked);
  b.setAttribute("aria-pressed", svLiked ? "true" : "false");
  if(beat){ b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat"); }   // نبضة خفيفة (transform فقط)
}
function updOwnerStats(){
  $("svViews").textContent = "👁 " + Object.keys(svViewers).length + " · ❤️ " + Object.keys(svLikes).length;
  if(sv && sv.sheet) renderViewers();
}
function dropCurVid(){
  if(sv && sv.vid){ try{ sv.vid.pause(); }catch{} sv.vid.removeAttribute("src"); sv.vid.load(); sv.vid = null; }
}
function showStory(){
  if(!sv) return;
  cancelAnimationFrame(sv.raf); detachViews(); dropCurVid(); clearTimeout(tapTimer); tapTimer = null;
  const tok = ++svTok;
  const s = sv.list[sv.idx], mine = sv.uid === me.uid;
  sv.elapsed = 0; sv.last = performance.now(); sv.vready = false; sv.vfail = false; sv.tryT = 0;

  const bars = $("svBars"); bars.innerHTML = "";
  sv.list.forEach((_, i)=>{ const b = el("div","sv-bar"), f = el("i"); f.style.width = i < sv.idx ? "100%" : "0"; b.appendChild(f); bars.appendChild(b); });

  const av = $("svAvatar"); av.dataset.uid = sv.uid; av.dataset.fb = s.name || ""; av.classList.remove("ring","seen");
  { const p = profileOf(sv.uid, s.name); paintAvatar(av, p.name, p.photo); }
  $("svName").textContent = mine ? "حالتي" : profileOf(sv.uid, s.name).name;
  $("svTime").textContent = fmtTime(s.ts);

  const body = $("svBody"); body.innerHTML = "";
  if(s.type === "video"){
    const v = document.createElement("video");
    v.playsInline = true; v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline",""); v.muted = svMuted; v.preload = "auto";
    sv.vid = v; body.appendChild(v);
    const sp = el("div","sv-spin"); body.appendChild(sp);
    const fail = (t)=>{ if(tok !== svTok || !sv) return; sp.remove(); sv.vfail = true; sv.last = performance.now(); body.appendChild(el("div","sv-msg", t)); };
    v.addEventListener("loadeddata", ()=>sp.remove());
    v.addEventListener("playing", ()=>sp.remove());
    v.addEventListener("error", ()=>{ if(v.getAttribute("src")) fail("تعذّر تشغيل الفيديو على جهازك"); });
    getVideoURL(s).then(url=>{ if(tok !== svTok || !sv) return; v.src = url; sv.vready = true; }).catch(()=>fail("تعذّر تحميل الفيديو"));
    if(s.text) body.appendChild(el("div","sv-cap", s.text));
    const nx = sv.list[sv.idx + 1];                        // تحميل مسبق للفيديو التالي
    if(nx && nx.type === "video") getVideoURL(nx).catch(()=>{});
  }else if(s.type === "image" && typeof s.image === "string" && s.image.startsWith("data:image/")){
    const img = new Image(); img.alt = ""; img.src = s.image; body.appendChild(img);
    if(s.text) body.appendChild(el("div","sv-cap", s.text));
  }else{
    const t = el("div","sv-text", s.text || ""); t.style.background = BGS[s.bg] || BGS[0]; body.appendChild(t);
  }
  { const nx = sv.list[sv.idx + 1]; if(nx && nx.type === "video" && s.type !== "video") getVideoURL(nx).catch(()=>{}); }

  $("svMute").classList.toggle("hidden", s.type !== "video");
  $("svMute").textContent = svMuted ? "🔇" : "🔊";
  $("svDel").classList.toggle("hidden", !mine);
  $("svViews").classList.toggle("hidden", !mine);
  $("svReply").classList.toggle("hidden", mine);
  $("svLike").classList.toggle("hidden", mine);
  $("svReplyInput").value = "";
  svLiked = false; paintLike();
  if(mine){
    $("svViews").textContent = "👁 0 · ❤️ 0";
    svViewsRef = db.ref("storyViews/"+s.id);
    svViewsRef.on("value", snap=>{ svViewers = snap.val() || {}; updOwnerStats(); }, err=>console.warn("views:", err.code || err));
    svLikesRef = db.ref("storyLikes/"+s.id);
    svLikesRef.on("value", snap=>{ svLikes = snap.val() || {}; updOwnerStats(); }, err=>console.warn("likes:", err.code || err));
  }else{
    svMyLikeRef = db.ref("storyLikes/"+s.id+"/"+me.uid);          // مستمع حيّ: يتحدّث فوراً عند الفتح أو من جهاز آخر
    svMyLikeRef.on("value", x=>{ if(tok === svTok){ svLiked = !!x.val(); paintLike(); } }, ()=>{});
    if(!seen[s.id]){
      seen[s.id] = true; saveSeen();
      db.ref("storyViews/"+s.id+"/"+me.uid).set(firebase.database.ServerValue.TIMESTAMP).catch(()=>{});
    }
  }
  sv.raf = requestAnimationFrame(svTick);
}
function tryPlayVid(v){
  v.muted = svMuted;
  const p = v.play();
  if(p && p.catch) p.catch(()=>{            // المتصفح منع الصوت → نشغّله صامتاً
    if(!svMuted){ svMuted = true; v.muted = true; $("svMute").textContent = "🔇"; v.play().catch(()=>{}); }
  });
}
function svTick(now){
  if(!sv) return;
  const s = sv.list[sv.idx], bar = $("svBars").children[sv.idx], paused = svPaused();
  if(s.type === "video" && !sv.vfail){          // الفيديو: التقدم حسب زمن التشغيل والانتقال عند نهايته
    const v = sv.vid;
    if(v && sv.vready){
      if(paused){ if(!v.paused) v.pause(); }
      else if(v.paused && !v.ended && now - sv.tryT > 400){ sv.tryT = now; tryPlayVid(v); }
      if(bar && v.duration) bar.firstElementChild.style.width = Math.min(100, v.currentTime / v.duration * 100) + "%";
      if(v.ended){ svNext(); return; }
    }
    sv.last = now; sv.raf = requestAnimationFrame(svTick); return;
  }
  if(!paused) sv.elapsed += now - sv.last;
  sv.last = now;
  if(bar) bar.firstElementChild.style.width = Math.min(100, sv.elapsed / STORY_MS * 100) + "%";
  if(sv.elapsed >= STORY_MS){ svNext(); return; }
  sv.raf = requestAnimationFrame(svTick);
}
function svNext(){
  if(!sv) return;
  if(sv.idx < sv.list.length - 1){ sv.idx++; showStory(); return; }
  while(++sv.qi < sv.queue.length){                          // التالي: أشخاص لديهم حالات غير مشاهَدة
    const l = storiesByUser[sv.queue[sv.qi]];
    if(l && l.length){
      const q = sv.queue, qi = sv.qi, u = q[qi];
      sv = {...sv, uid: u, list: l.slice(), idx: Math.max(0, l.findIndex(s=>!seen[s.id])), qi, queue: q};
      showStory(); return;
    }
  }
  closeViewer();
}
function svPrev(){
  if(!sv) return;
  if(sv.elapsed > 1200 || sv.idx === 0 || (sv.vid && sv.vid.currentTime > 1.2)){ showStory(); return; }
  sv.idx--; showStory();
}
function closeViewer(silent){
  if(sv) cancelAnimationFrame(sv.raf);
  dropCurVid(); detachViews(); clearTimeout(tapTimer); tapTimer = null; sv = null; svTok++;
  $("sv").classList.add("hidden"); $("svBody").innerHTML = ""; $("vwSheet").classList.remove("open");
  if(!silent) rebuildStories();
}
$("svClose").onclick = ()=>closeViewer();
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ if(sv) closeViewer(); else if(!$("stComp").classList.contains("hidden")) closeComposer(); } });
$("svMute").onclick = ()=>{ svMuted = !svMuted; $("svMute").textContent = svMuted ? "🔇" : "🔊"; if(sv && sv.vid) sv.vid.muted = svMuted; };

/* لمسة قصيرة = تنقّل · إبقاء الإصبع = إيقاف مؤقت */
function bindZone(id, action){
  const z = $(id); let t0 = 0, held = false;
  const down = ()=>{ if(!sv) return; t0 = performance.now(); held = true; sv.holds++; };
  const up = (nav)=>{
    if(!sv || !held) return; held = false; sv.holds = Math.max(0, sv.holds - 1);
    if(!nav || performance.now() - t0 >= 260) return;
    if(sv.uid === me.uid){ action(); return; }                       // حالتي: تنقّل فوري بلا تأخير
    const now = performance.now();
    if(tapTimer && now - tapAt < 260){ clearTimeout(tapTimer); tapTimer = null; toggleLike(); return; }   // نقر مزدوج = قلب
    tapAt = now; tapTimer = setTimeout(()=>{ tapTimer = null; action(); }, 260);                          // ننتظر لحظة: نقرة ثانية؟
  };
  z.addEventListener("pointerdown", down);
  z.addEventListener("pointerup", ()=>up(true));
  z.addEventListener("pointerleave", ()=>up(false));
  z.addEventListener("pointercancel", ()=>up(false));
}
bindZone("svNext", ()=>svNext());
bindZone("svPrev", ()=>svPrev());

/* ❤️ الإعجاب بالحالة — داخل الحالة فقط (بلا أي إشعار تنبيهي) */
function toggleLike(){
  if(!sv || sv.uid === me.uid) return;
  const s = sv.list[sv.idx], want = !svLiked, tok = svTok;
  svLiked = want; paintLike(true);
  playSound(want ? "like" : "click");
  if(want){
    const h = el("div","sv-heart","❤️"); $("svBody").appendChild(h); setTimeout(()=>h.remove(), 850);
  }
  db.ref("storyLikes/"+s.id+"/"+me.uid).set(want ? true : null)
    .catch(err=>{ console.error(err); if(tok === svTok){ svLiked = !want; paintLike(); } toast("تعذّر تسجيل الإعجاب — تأكد من نشر قواعد storyLikes"); });
}
$("svLike").onclick = toggleLike;

/* رد على الحالة → رسالة في المحادثة */
$("svReplyInput").addEventListener("focus", ()=>{ if(sv) sv.typing = true; });
$("svReplyInput").addEventListener("blur",  ()=>{ if(sv) sv.typing = false; });
$("svReply").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const text = $("svReplyInput").value.trim();
  if(!text || !sv || sv.uid === me.uid) return;
  const uid = sv.uid, name = profileOf(uid, sv.list[sv.idx].name).name;
  $("svReplyInput").value = ""; $("svReplyInput").blur(); playSound("send");
  try{
    const r = await sendMessageTo(uid, name, "↩️ " + text);
    if(r === "queued") toast("حُفظ ردّك وسيُرسل عند عودة الاتصال", "info", "⏳"); else toast("تم إرسال ردّك", true);
  }
  catch{ toast("تعذّر إرسال الرد"); }
});

/* حذف حالتي */
$("svDel").onclick = async ()=>{
  if(!sv || sv.uid !== me.uid) return;
  const s = sv.list[sv.idx];
  if(!(await askConfirm("حذف هذه الحالة نهائياً؟", "حذف"))) return;
  try{
    const jobs = [db.ref("storyViews/"+s.id).remove(), db.ref("storyLikes/"+s.id).remove()];
    if(s.type === "video") jobs.push(db.ref("storyChunks/"+me.uid+"/"+s.id).remove());
    await Promise.all(jobs.map(p=>p.catch(()=>{})));
    await db.ref("stories/"+s.id).remove();
    toast("تم حذف الحالة", true);
    if(!sv) return;
    sv.list.splice(sv.idx, 1);
    if(!sv.list.length){ closeViewer(); return; }
    if(sv.idx >= sv.list.length) sv.idx = sv.list.length - 1;
    showStory();
  }catch(err){ console.error(err); toast("تعذّر حذف الحالة"); }
};

/* قائمة من شاهد/أعجب بحالتي */
function renderViewers(){
  const box = $("vwList"); box.innerHTML = "";
  const ids = Array.from(new Set([...Object.keys(svViewers), ...Object.keys(svLikes)])).sort((a,b)=>(svViewers[b]||0) - (svViewers[a]||0));
  $("vwTitle").textContent = "المشاهدات (" + Object.keys(svViewers).length + ") · ❤️ " + Object.keys(svLikes).length;
  if(!ids.length){ box.appendChild(el("div","empty","لم يشاهد أحد حالتك بعد")); return; }
  ids.forEach(u=>{
    const row = el("div","user-item glass"); row.style.cursor = "default";
    row.appendChild(avatarFor(u, ""));
    const inf = el("div","grow"); inf.appendChild(nameFor(u, "", "div", "nm")); inf.appendChild(el("div","last", fmtTime(svViewers[u])));
    row.appendChild(inf);
    if(svLikes[u]) row.appendChild(el("span", null, "❤️"));
    box.appendChild(row);
  });
}
$("svViews").onclick = ()=>{ if(!sv) return; sv.sheet = true; renderViewers(); $("vwSheet").classList.add("open"); };
function closeViewers(){ $("vwSheet").classList.remove("open"); if(sv) sv.sheet = false; }
$("vwClose").onclick = closeViewers;
$("vwSheet").addEventListener("click", e=>{ if(e.target === $("vwSheet")) closeViewers(); });
</script>
</body>
