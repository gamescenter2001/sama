<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4fb">
<title>سماء</title>

<!-- ═══════════ مكتبات Firebase (Compat SDK 9) ═══════════ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{--bg1:#eef2fb;--bg2:#f7f3fb;--glass:rgba(255,255,255,.58);--border:rgba(255,255,255,.7);--line:rgba(60,60,67,.13);
--text:#1d1d1f;--muted:#6e6e73;--neon1:#5e5ce6;--neon2:#0a84ff;--danger:#ff453a;--radius:18px;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 600px at 90% -10%,#cfe0ff88,transparent 60%),radial-gradient(800px 600px at -10% 110%,#e6d4ff77,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
button,input,textarea{font-family:inherit;font-size:16px;color:var(--text)}
button{cursor:pointer;border:none;background:none;transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--neon2);outline-offset:2px}
.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 8px 28px rgba(40,50,100,.09),inset 0 1px 0 rgba(255,255,255,.9)}
.user-item.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.72)}
.field{width:100%;padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid var(--line);outline:none;transition:border-color .15s,box-shadow .15s}
.field::placeholder{color:#9a9aa0}
.field:focus{border-color:var(--neon2);box-shadow:0 0 0 3px rgba(10,132,255,.18)}
.btn{padding:12px 20px;border-radius:12px;font-weight:600;background:var(--neon2);color:#fff;box-shadow:0 1px 2px rgba(10,132,255,.35)}
.btn:hover{background:#2b95ff}.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid var(--line)}
.btn-ghost:hover{background:#fff}
.logo{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--neon2),var(--neon1),#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
#authScreen,.splash,#setupScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:410px;padding:30px 24px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.auth-card .logo{font-size:44px;text-align:center}
.auth-card .tag{text-align:center;color:var(--muted);margin:4px 0 20px}
.tabs{display:flex;gap:4px;background:rgba(120,120,128,.14);padding:3px;border-radius:11px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px}
.tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--danger);font-size:14px;min-height:20px;text-align:center}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:18px}.hint.ok{color:#1f9d55}.hint.bad{color:var(--danger)}
.cfg-warn{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.35);font-size:13px;line-height:1.7}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600}
.g-btn:disabled{opacity:.6}.g-btn svg{width:20px;height:20px;flex-shrink:0}
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.62);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line)}
header.top .logo{font-size:26px}
.me-chip{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:16px 14px 110px}
.view{display:none}.view.active{display:block;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,#64a8ff,#a77bff);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.avatar.sm{width:32px;height:32px;font-size:14px}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.has-photo{background:#e8e8ee}
.avatar.ring{box-shadow:0 0 0 2px #fff,0 0 0 4.5px #30c75e;cursor:pointer}
.avatar.ring.seen{box-shadow:0 0 0 2px #fff,0 0 0 4.5px #c4c4cc}
.user-item{display:flex;align-items:center;gap:12px;padding:11px 13px;margin-bottom:10px;cursor:pointer;transition:background .15s}
.user-item:hover{background:#fff}.user-item .nm{font-weight:700}
.user-item .em{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.user-item .grow{flex:1;min-width:0}
.user-item .nm,.user-item .em,.user-item .last{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-item .last{font-size:13px;color:var(--muted)}.user-item .time{font-size:11px;color:var(--muted);flex-shrink:0}
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--neon2);flex-shrink:0}
.user-item.has-unread .last{color:var(--text);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
h2.title{margin:4px 4px 14px;font-size:20px}
#chatPanel,#profilePanel{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg1),var(--bg2));transform:translateX(-100%);visibility:hidden;transition:transform .24s var(--ease),visibility 0s .24s}
#chatPanel.open,#profilePanel.open{transform:none;visibility:visible;transition-delay:0s}
#profilePanel{z-index:50}#chatPanel{z-index:60}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.chat-head .mini{margin-inline-start:auto}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;max-width:720px;width:100%;margin:0 auto}
.msg{max-width:78%;padding:9px 14px;border-radius:18px;line-height:1.6;word-break:break-word;white-space:pre-wrap;font-size:15px;animation:fade .14s ease-out}
.msg .t{display:block;font-size:11px;opacity:.6;margin-top:3px}
.msg.mine{align-self:flex-start;background:var(--neon2);color:#fff;border-bottom-right-radius:5px}
.msg.theirs{align-self:flex-end;background:rgba(255,255,255,.88);border:1px solid var(--line);border-bottom-left-radius:5px}
.chat-form{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);max-width:720px;width:100%;margin:0 auto}
nav.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:30;width:calc(100% - 28px);max-width:460px;display:flex;padding:5px;margin-bottom:env(safe-area-inset-bottom);border-radius:22px}
nav.bottom button{flex:1;padding:7px 2px;border-radius:17px;color:var(--muted);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bottom button i{font-style:normal;font-size:19px;line-height:1}
nav.bottom button.active{color:var(--neon2);background:rgba(10,132,255,.12)}
.nav-dot{position:absolute;top:5px;inset-inline-end:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid #fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:6px}
.hd-right{display:flex;align-items:center;gap:10px}
.unread-badge,.nav-badge{background:#ff3b30;color:#fff;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:999px}
.unread-badge{min-width:22px;height:22px;padding:0 6px;font-size:12px;flex-shrink:0;box-shadow:0 2px 6px rgba(255,59,48,.4)}
.nav-badge{position:absolute;top:0;inset-inline-end:calc(50% - 28px);min-width:19px;height:19px;padding:0 4px;font-size:11px;border:2px solid #fff;box-sizing:border-box}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:16px}.icon-btn:hover{background:#fff}
.search-bar{display:flex;align-items:center;gap:10px;padding:2px 16px;margin-bottom:14px;border-radius:999px}
.search-bar:focus-within{box-shadow:0 0 0 3px rgba(10,132,255,.2)}
.search-bar input{flex:1;min-width:0;background:none;border:none;outline:none;padding:12px 0;-webkit-appearance:none;appearance:none}
.search-bar input::placeholder{color:#9a9aa0}.search-bar input::-webkit-search-cancel-button{display:none}
.search-bar button{width:26px;height:26px;border-radius:50%;background:rgba(120,120,128,.2);font-size:12px}
.sub{font-size:14px;color:var(--muted);font-weight:700;margin:18px 6px 10px}
.row-actions{display:flex;gap:6px;flex-shrink:0}
.mini{padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.78);border:1px solid var(--line);white-space:nowrap}
.mini:hover{background:#fff}.mini.primary{background:var(--neon2);border-color:transparent;color:#fff}
.mini.on,.btn-ghost.on{color:var(--neon2);border-color:rgba(10,132,255,.45);background:rgba(10,132,255,.08)}.mini:disabled{opacity:.5}
mark{background:rgba(10,132,255,.22);color:inherit;border-radius:4px;padding:0 2px}
@media (max-width:520px){.mini .lbl{display:none}.mini{padding:8px 12px;font-size:15px}}
.pick{position:relative;align-self:center;cursor:pointer;margin-bottom:4px}.pick .avatar{width:104px;height:104px;font-size:44px}
.pick .cam{position:absolute;bottom:0;left:0;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#setupRemove{align-self:center}
.handle{display:flex;align-items:center;gap:8px;direction:ltr}.handle span{color:var(--muted);font-weight:700;font-size:18px}
.me-handle{color:var(--neon2);font-weight:700;direction:ltr;margin-top:2px}
.me-email{color:var(--muted);font-size:13px;direction:ltr;margin:6px 0 18px}
.pf-body{flex:1;overflow-y:auto;padding:16px 14px 30px;max-width:720px;width:100%;margin:0 auto}
.pf-card{padding:24px 18px;text-align:center;margin-bottom:6px}.pf-card .avatar{width:96px;height:96px;font-size:42px;margin:0 auto 12px}
.pf-card .pn{font-size:21px;font-weight:800}.pf-card .pe{color:var(--neon2);font-weight:600;direction:ltr;margin:4px 0 18px;font-size:15px}
.pf-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ═══════ الحالات (Status) ═══════ */
.st-me{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px;cursor:pointer}
.st-me .grow{flex:1;min-width:0}.st-me .nm{font-weight:700}.st-me .last{font-size:13px;color:var(--muted)}
.st-add{width:42px;height:42px;border-radius:50%;background:var(--neon2);color:#fff;font-size:22px;line-height:1;box-shadow:0 2px 10px rgba(10,132,255,.4);flex-shrink:0}

/* ═══════ عارض الحالات ═══════ */
.sv{position:fixed;inset:0;z-index:80;background:#05061a;display:flex;justify-content:center;animation:fade .15s ease-out}
.sv-stage{position:relative;width:100%;max-width:480px;height:100%;background:#000;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sv-body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sv-body img{width:100%;height:100%;object-fit:contain;background:#000}
.sv-text{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:70px 28px;text-align:center;color:#fff;font-size:28px;font-weight:700;line-height:1.6;word-break:break-word;white-space:pre-wrap;overflow-y:auto}
.sv-cap{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));padding:12px 18px;text-align:center;color:#fff;font-size:16px;line-height:1.6;background:linear-gradient(transparent,rgba(0,0,0,.55) 40%);text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:pre-wrap;word-break:break-word}
.sv-shade{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none;z-index:2}
.sv-bars{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:4px;z-index:5;direction:ltr}
.sv-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bar i{display:block;height:100%;width:0;background:#fff}
.sv-head{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 14px);left:10px;right:10px;display:flex;align-items:center;gap:10px;z-index:6;color:#fff}
.sv-who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.sv-who b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sv-who span{font-size:12px;opacity:.8}
.sv-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sv-zone{position:absolute;top:90px;bottom:90px;z-index:3;cursor:pointer}
.sv-zone.r{right:0;width:35%}.sv-zone.l{left:0;width:65%}
.sv-foot{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.sv-foot form{flex:1;display:flex;gap:8px}
.sv-foot input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;outline:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sv-foot input::placeholder{color:rgba(255,255,255,.7)}
.sv-foot .send{width:44px;height:44px;border-radius:50%;background:var(--neon2);color:#fff;font-size:17px}
.sv-views{margin:0 auto;padding:10px 20px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sv-msg{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;color:#fff;opacity:.8}

/* ═══════ مُنشئ الحالة ═══════ */
.stc{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;animation:fade .15s ease-out}
.stc-canvas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .25s}
.stc-canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stc-canvas textarea{position:relative;width:100%;max-width:520px;height:60%;resize:none;border:none;outline:none;background:transparent;color:#fff;text-align:center;font-size:28px;font-weight:700;line-height:1.6;padding:20px 28px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.stc-canvas textarea::placeholder{color:rgba(255,255,255,.65)}
.stc-canvas textarea.cap{position:absolute;bottom:96px;height:auto;min-height:56px;max-height:30%;font-size:17px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.55) 40%);padding:16px 20px}
.stc-top{position:absolute;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;z-index:2}
.stc-bottom{position:absolute;bottom:0;left:0;right:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:2}
.stc-bottom .spacer{flex:1}
.sv-pill{padding:11px 16px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-weight:600;font-size:14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.keep-lbl .lbl{display:inline!important}
.nt-item .row-actions{align-self:center}
.sv-spin{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:svspin .8s linear infinite;z-index:1;pointer-events:none}
@keyframes svspin{to{transform:rotate(360deg)}}
.sv-body video{width:100%;height:100%;object-fit:contain;background:#000}
.sv-like{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);font-size:22px;flex-shrink:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sv-like.liked{background:rgba(255,55,95,.4)}
.sv-heart{position:absolute;top:50%;left:50%;margin:-48px 0 0 -48px;font-size:96px;line-height:1;pointer-events:none;z-index:7;animation:heartpop .8s ease forwards;filter:drop-shadow(0 0 24px rgba(255,55,95,.8))}
@keyframes heartpop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3) translateY(-30px)}}
.stc-canvas video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stc-bar{position:absolute;top:0;left:0;right:0;height:4px;z-index:3;background:rgba(255,255,255,.2)}
.stc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a84ff,#bf5af2);transition:width .2s}
/* ═══════ نوافذ سفلية ═══════ */
.sheet-back{position:fixed;inset:0;z-index:90;background:rgba(30,35,70,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .18s,visibility 0s .18s}
.sheet-back.open{opacity:1;visibility:visible;transition-delay:0s}
.sheet{width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;gap:12px;border-radius:24px 24px 0 0;background:rgba(255,255,255,.88);transform:translateY(100%);transition:transform .26s var(--ease);padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet-back.open .sheet{transform:none}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:rgba(60,60,67,.25);margin:0 auto -2px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet-head b{font-size:17px}
.sheet-list{flex:1;min-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.bell{position:relative}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none}
.bell.ring{animation:ring .7s ease}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
.nt-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(120,120,128,.08);cursor:pointer;transition:background .15s}
.nt-item:hover{background:rgba(120,120,128,.16)}.nt-item.unread{background:rgba(10,132,255,.1)}
.nt-av{position:relative;flex-shrink:0}

.toast{display:flex;align-items:center;gap:12px;min-width:190px;max-width:min(88vw,380px);padding:14px 20px 14px 22px;border-radius:22px;
  background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.85);
  backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);
  box-shadow:0 14px 44px rgba(30,40,90,.24),0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 0 #fff;

.toast.ok .ti{background:rgba(48,209,88,.18)}.toast.info .ti{background:rgba(10,132,255,.15)}
.toast .tx{flex:1;min-width:0;word-break:break-word}
.toast.out{animation:tOut .18s ease forwards}
@keyframes tIn{from{opacity:0;transform:scale(.84) translateY(10px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:scale(.94)}}
.dlg-back{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(30,35,70,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .15s}

    "auth/operation-not-supported-in-this-environment":"افتح التطبيق عبر https أو localhost (لا يعمل من file://)"
  };
  return map[code] || "حدث خطأ غير متوقع، حاول مرة أخرى";

}

/* ── الصور: قص مربع + تصغير + Base64 ── */
function drawAvatar(img, size=256, q=.85){
  const W = img.naturalWidth||img.width, H = img.naturalHeight||img.height, m = Math.min(W,H);
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"); x.fillStyle = "#1a1b3a"; x.fillRect(0,0,size,size);
  x.drawImage(img,(W-m)/2,(H-m)/2,m,m,0,0,size,size);
  return c.toDataURL("image/jpeg", q);
}
function fileToAvatar(file){
  return new Promise((res,rej)=>{
    const r = new FileReader(); r.onerror = ()=>rej();
    r.onload = ()=>{ const i = new Image(); i.onerror = ()=>rej(); i.onload = ()=>res(drawAvatar(i)); i.src = r.result; };
    r.readAsDataURL(file);
  });
}
function urlToAvatar(url){          // صورة جوجل → Base64 (يرجع null عند الفشل)
  return new Promise(res=>{
    const i = new Image(); i.crossOrigin = "anonymous"; i.referrerPolicy = "no-referrer";
    const t = setTimeout(()=>res(null), 7000);
    i.onload = ()=>{ clearTimeout(t); try{ res(drawAvatar(i)); }catch{ res(null); } };
    i.onerror = ()=>{ clearTimeout(t); res(null); };
    i.src = url.replace(/=s\d+-c$/, "=s256-c");
  });
}
// ضغط صورة الحالة وتحويلها إلى Base64 (JPEG)
function fileToBase64(file, maxSide = 900, quality = 0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("read"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("img"));
      img.onload = ()=>{
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const scale = Math.min(1, maxSide / Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ── عرض الصورة/الحرف + مزامنة حيّة مع ملف المستخدم ── */
function paintAvatar(node, name, photo){
  photo = photo || null;
  if(node._n === name && node._p === photo) return;
  node._n = name; node._p = photo;
  node.textContent = ""; node.classList.toggle("has-photo", !!photo);
  if(photo){
    const i = new Image(); i.alt = ""; i.referrerPolicy = "no-referrer";
    i.onerror = ()=>{ node.classList.remove("has-photo"); node.textContent = initial(name); };
    i.src = photo; node.appendChild(i);
  }else node.textContent = initial(name);
}
function profileOf(uid, fb){
  if(me && uid === me.uid) return me;
  const u = usersCache[uid];
  return {name:(u && u.name) || fb || "مستخدم", photo:(u && u.photo) || null};

  let rec = null;
  try{

    if(cachedMe){                                   // لا نعلّق على الشبكة: بعد 5 ثوانٍ نفتح بالنسخة المحفوظة
      const r = await Promise.race([db.ref("users/"+me.uid).once("value").then(x=>x.val()), new Promise(res=>setTimeout(()=>res(undefined), 5000))]);
      rec = r === undefined ? {name: cachedMe.name, username: cachedMe.username, photo: cachedMe.photo || null} : r;
    }else rec = (await db.ref("users/"+me.uid).once("value")).val();
    if(rec && rec.email !== undefined) db.ref("users/"+me.uid+"/email").remove().catch(()=>{});
    if(!rec && user.providerData.some(p=>p.providerId === "google.com")){
      me.name = (user.displayName || "").slice(0,30);
      if(user.photoURL) me.photo = await urlToAvatar(user.photoURL);

  if(!rec || !rec.username || rec.profileDone === false){ openSetup(true); return; }

/* ═══════════════════════════════════════════════════════════
   🔊 أصوات تفاعلية (Web Audio API — بدون ملفات خارجية)
   ═══════════════════════════════════════════════════════════ */
let audioCtx = null, soundOn = true, chatReady = false;
try{ soundOn = localStorage.getItem("sama_sound") !== "off"; }catch{}

function getAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ audioCtx = new AC(); }catch{ return null; }
  }
  if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev, ()=>getAudio(), {passive:true}));

let master = null, lastSoundT = 0;
function bus(c){                                   // ضاغط + تضخيم: صوت واضح بلا تشويه
  if(master && master.ctx === c) return master.node;
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = .002; comp.release.value = .12;
  const g = c.createGain(); g.gain.value = 1.4; g.connect(comp); comp.connect(c.destination);
  master = {ctx:c, node:g}; return g;
}
function tone(ctx, t0, freq, dur, o){
  o = o || {};
  const osc = ctx.createOscillator(), g = ctx.createGain(), vol = o.vol || .3;
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur * (o.at || 1));
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || .006));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g); g.connect(bus(ctx));
  osc.start(t0); osc.stop(t0 + dur + .03);
}
/* فقاعة ناعمة: نغمة تصعد سريعاً مثل "بق" — أساس + جزئية علوية خافتة */
function bubble(ctx, t0, f0, f1, dur, vol){
  tone(ctx, t0, f0, dur, {to:f1, at:.6, vol, atk:.01});
  tone(ctx, t0, f0*2, dur*.7, {to:f1*2, at:.6, vol:vol*.18, type:"triangle", atk:.01});
}
function bell(ctx, t0, f, dur, vol){               // نغمة جرس: أساس + جزئيات
  tone(ctx, t0, f, dur, {vol});
  tone(ctx, t0, f*2, dur*.6, {vol:vol*.35, type:"triangle"});
  tone(ctx, t0, f*3.01, dur*.3, {vol:vol*.12});
}
function playSound(kind){
  if(!soundOn) return;
  const c = getAudio(); if(!c) return;
  try{
    const t = c.currentTime + .005; lastSoundT = performance.now();
    switch(kind){
      case "click":                                 // نبضة "بق" واحدة: فقاعة قصيرة ونظيفة
        bubble(c, t, 520, 960, .085, .38);
        break;
      case "like":                                  // نبضة قلب: خفقتان قصيرتان دافئتان
        bubble(c, t,      440, 700, .08, .34);
        bubble(c, t+.085, 560, 900, .11, .36);
        break;
      case "send": case "message": case "notify":   // نغمة إشعار موحّدة: عند الإرسال والوصول
        bell(c, t,     988,  .2,  .30);
        bell(c, t+.11, 1319, .22, .32);
        bell(c, t+.22, 1760, .55, .34);
        break;
    }
  }catch(e){ /* الصوت ميزة إضافية ولا يجب أن يعطّل التطبيق */ }
}

$("soundToggle").onclick = ()=>{

/* ═══════════════════════════════════════════════════════════
   🔔 الإشعارات  notifications/{uid}/{id}
   الأنواع: message · friendRequest · friendAccept   (إعجاب الحالة لا يرسل إشعاراً)
   ═══════════════════════════════════════════════════════════ */
let notifRef = null, notifCache = {}, notifReady = false;

function pushNotif(toUid, key, data){
  if(!me || !toUid || toUid === me.uid) return;
  const base = db.ref("notifications/"+toUid);
  const ref = key ? base.child(key) : base.push();
  ref.set({from: me.uid, fromName: me.name, read: false, ts: firebase.database.ServerValue.TIMESTAMP, ...data})
     .catch(e=>console.warn("notify:", e.code || e));
}
function removeNotif(toUid, key){ db.ref("notifications/"+toUid+"/"+key).remove().catch(()=>{}); }

function listenNotifs(){
  stopNotifs();
  notifReady = false;
  notifRef = db.ref("notifications/"+me.uid).orderByChild("ts").limitToLast(80);
  notifRef.on("child_added", s=>{
    const n = s.val(); if(!n) return;
    notifCache[s.key] = n; renderNotifs();
    if(notifReady && !n.read) onNewNotif(s.key, n);
  }, err=>console.warn("notifications:", err.code || err));
  notifRef.on("child_changed", s=>{
    const n = s.val(), old = notifCache[s.key] || {};
    if(!n) return;
    notifCache[s.key] = n; renderNotifs();
    if(notifReady && !n.read && (n.ts || 0) > (old.ts || 0)) onNewNotif(s.key, n);
  });
  notifRef.on("child_removed", s=>{ delete notifCache[s.key]; renderNotifs(); });
  const mine = notifRef;
  notifRef.once("value").then(()=>{ if(notifRef === mine) notifReady = true; }).catch(()=>{ notifReady = true; });
}
function stopNotifs(){
  if(notifRef){ notifRef.off(); notifRef = null; }
  notifCache = {}; notifReady = false;
  paintUnread();
}

/* ── عدّاد الرسائل غير المقروءة: userChats/{me}/{other}/unread (المُرسِل يزيده بـ increment، وأنا أصفّره) ── */
const unreadOf = (uid)=>{ const c = userChatsCache[uid]; return c ? (+c.unread || 0) : 0; };
function paintUnread(){
  let n = 0;
  if(me) for(const u in userChatsCache) n += unreadOf(u);
  const b = $("navChatBadge");
  b.textContent = n > 99 ? "99+" : String(n);
  b.classList.toggle("hidden", n === 0);
  document.title = n ? "(" + n + ") سماء" : "سماء";
}
function clearUnread(uid){
  const c = userChatsCache[uid];
  if(!c || !c.unread) return;
  c.unread = 0; paintUnread(); renderChats(); scheduleCache();
  db.ref("userChats/"+me.uid+"/"+uid+"/unread").set(0).catch(()=>{});
}

const NT_ICON = {message:"✉️", friendRequest:"🤝", friendAccept:"✅"};
function notifAction(n){
  if(n.type === "message") return "أرسل لك رسالة";
  if(n.type === "friendRequest") return "أرسل لك طلب صداقة";
  if(n.type === "friendAccept") return "قبل طلب صداقتك";
  return "لديك إشعار جديد";
}

function onNewNotif(id, n){
  if(n.type === "storyLike") return;                 // إعجاب الحالة يبقى داخل الحالة فقط
  /* رسالة من شخص محادثته مفتوحة الآن: تظهر في الشات نفسه، نعلّمها مقروءة بلا تنبيه مكرر */
  if(n.type === "message" && chatOther && chatOther.uid === n.from && $("chatPanel").classList.contains("open")){
    markRead(id); return;
  }
  playSound("message");
  const nm = profileOf(n.from, n.fromName).name;
  toast(n.type === "message" ? nm + ": " + (n.text || "أرسل لك رسالة") : nm + " " + notifAction(n), "info", NT_ICON[n.type] || "🔔");
}
function renderNotifs(){ renderChats(); }
function markRead(id){
  if(!notifCache[id] || notifCache[id].read) return;
  notifCache[id] = {...notifCache[id], read:true};
  db.ref("notifications/"+me.uid+"/"+id+"/read").set(true).catch(()=>{});
}

/* ═══════════════════════════════════════════════════════════
   3) البحث (أشخاص)
   ═══════════════════════════════════════════════════════════ */
const AR_MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ى":"ي","ة":"ه","ؤ":"و","ئ":"ي"};
function normMap(str){
  str = String(str || "");
  let n = "", map = [];
  for(let i=0;i<str.length;i++){
    const ch = str[i];
    if(/[ً-ٰٟـ]/.test(ch)) continue;
    const c = (AR_MAP[ch] || ch).toLowerCase();
    for(let k=0;k<c.length;k++) map.push(i);
    n += c;
  }
  return {n, map};
}
const norm = (str)=>normMap(str).n;
function hl(text, q){
  const frag = document.createDocumentFragment();
  text = String(text || "");
  if(!q){ frag.append(text); return frag; }
  const {n, map} = normMap(text);
  let pos = 0, from = 0, i;
  while((i = n.indexOf(q, from)) !== -1){
    const st = map[i], en = map[i + q.length - 1] + 1;
    if(st >= pos){
      if(st > pos) frag.append(text.slice(pos, st));
      frag.append(el("mark", null, text.slice(st, en)));
      pos = en;
    }
    from = i + q.length;
  }
  if(pos < text.length) frag.append(text.slice(pos));
  return frag;
}
function sub(t){ return el("div","sub",t); }
function nameOf(uid){
  return (usersCache[uid] && usersCache[uid].name) || (userChatsCache[uid] && userChatsCache[uid].name) || "مستخدم";
}
function mkBtn(icon, label, cls){
  const b = el("button","mini "+(cls||"")); b.type = "button"; b.title = label; b.setAttribute("aria-label", label);
  b.append(icon + " "); b.appendChild(el("span","lbl",label));
  return b;
}
function matchUser(u, q){            // كل كلمات البحث يجب أن تظهر في الاسم أو المعرّف
  const hay = norm(u.name) + " " + norm(u.username);
  return q.split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}

/* ═══════════════════════════════════════════════════════════
   🤝 نظام طلبات الصداقة (بموافقة الطرف الآخر)
   friendRequests/{toUid}/{fromUid} → {from, ts}   (يقرؤه المستلم)
   sentRequests/{fromUid}/{toUid}   → true         (يقرؤه المُرسل)
   friends/{uid}/{friendUid}        → true         (يُكتب فقط عند الموافقة)
   ═══════════════════════════════════════════════════════════ */
let incomingMap = {}, sentSet = {}, reqRef = null, sentRef = null, incomingLoaded = false;
function relState(uid){
  if(friendsSet[uid]) return "friend";
  if(incomingMap[uid]) return "incoming";
  if(sentSet[uid]) return "sent";
  return "none";
}
async function guard(btn, fn){
  if(!netUp){ toast("لا يوجد اتصال بالإنترنت — حاول عند عودته", "err", "📡"); return; }
  if(btn) btn.disabled = true;
  try{ await fn(); }
  catch(err){ console.error(err); toast("تعذّر التنفيذ — تأكد من نشر قواعد friendRequests و sentRequests و friends في Firebase"); }
  finally{ if(btn) btn.disabled = false; }
}
function sendRequest(uid, name, btn){
  if(incomingMap[uid]) return acceptRequest(uid, btn);       // هو أرسل لك أصلاً → موافقة مباشرة
  return guard(btn, async ()=>{
    await db.ref().update({
      ["friendRequests/"+uid+"/"+me.uid]: {from: me.uid, ts: firebase.database.ServerValue.TIMESTAMP},
      ["sentRequests/"+me.uid+"/"+uid]: true
    });
    pushNotif(uid, "fr_"+me.uid, {type:"friendRequest"});
    toast("تم إرسال طلب الصداقة إلى " + name, true);
  });
}
function cancelRequest(uid, name, btn){
  return guard(btn, async ()=>{
    await db.ref().update({
      ["friendRequests/"+uid+"/"+me.uid]: null,
      ["sentRequests/"+me.uid+"/"+uid]: null
    });
    removeNotif(uid, "fr_"+me.uid);
    toast("تم إلغاء الطلب", "info", "↩️");
  });
}
function acceptRequest(uid, btn){
  return guard(btn, async ()=>{
    await db.ref().update({                                   // عملية ذرّية: الطرفان صديقان + حذف الطلب
      ["friends/"+me.uid+"/"+uid]: true,
      ["friends/"+uid+"/"+me.uid]: true,
      ["friendRequests/"+me.uid+"/"+uid]: null,
      ["sentRequests/"+uid+"/"+me.uid]: null,
      ["notifications/"+me.uid+"/fr_"+uid]: null
    });
    pushNotif(uid, "fa_"+me.uid, {type:"friendAccept"});
    toast("أصبحت أنت و" + nameOf(uid) + " صديقين", true);
  });
}
function declineRequest(uid, btn){                           // رفض هادئ: يُحذف الطلب دون إشعار للمُرسل
  return guard(btn, async ()=>{
    await db.ref().update({
      ["friendRequests/"+me.uid+"/"+uid]: null,
      ["sentRequests/"+uid+"/"+me.uid]: null,
      ["notifications/"+me.uid+"/fr_"+uid]: null
    });
  });
}
function unfriend(uid, name, btn){
  return guard(btn, async ()=>{
    await db.ref().update({["friends/"+me.uid+"/"+uid]: null, ["friends/"+uid+"/"+me.uid]: null});
    toast("تمت إزالة " + name, "info", "👋");
  });
}
async function friendAction(uid, name, btn){
  const st = relState(uid);
  if(st === "none") return sendRequest(uid, name, btn);
  if(st === "incoming") return acceptRequest(uid, btn);
  if(st === "sent"){
    if(await askConfirm("إلغاء طلب الصداقة المرسل إلى " + name + "؟", "إلغاء الطلب")) return cancelRequest(uid, name, btn);
    return;
  }
  if(await askConfirm("إزالة " + name + " من أصدقائك؟", "إزالة")) return unfriend(uid, name, btn);
}
function reqButtons(uid){                                    // أزرار "قبول" و"رفض"
  const w = el("div","row-actions keep-lbl");
  const a = mkBtn("✓","قبول","primary"), d = mkBtn("✕","رفض");
  a.onclick = (e)=>{ e.stopPropagation(); acceptRequest(uid, a); };
  d.onclick = (e)=>{ e.stopPropagation(); declineRequest(uid, d); };
  w.append(a, d); return w;
}
function stateButtons(uid, name){
  const st = relState(uid);
  if(st === "incoming") return reqButtons(uid);
  const acts = el("div","row-actions");
  if(st === "friend"){
    const fb = mkBtn("✓","صديق","on"); fb.onclick = (e)=>{ e.stopPropagation(); friendAction(uid, name, fb); };
    const mb = mkBtn("💬","محادثة","primary"); mb.onclick = (e)=>{ e.stopPropagation(); openChat(uid, name); };
    acts.append(fb, mb);
  }else if(st === "sent"){
    const sb = mkBtn("⏳","تم الإرسال","on"); sb.onclick = (e)=>{ e.stopPropagation(); friendAction(uid, name, sb); };
    acts.appendChild(sb);
  }else{
    const ab = mkBtn("➕","إضافة"); ab.onclick = (e)=>{ e.stopPropagation(); friendAction(uid, name, ab); };
    acts.appendChild(ab);
  }
  return acts;
}

function personRow(uid, u, q){
  if(me && uid === me.uid){
    const it = el("div","user-item glass"); it.appendChild(avatarFor(uid, u.name));
    const inf = el("div","grow"), nm = el("div","nm"), em = el("div","em");
    nm.appendChild(hl(u.name || "مستخدم", q)); nm.append(" (أنت)"); em.appendChild(hl(u.username ? "@" + u.username : "", q));
    inf.append(nm, em); it.appendChild(inf); it.onclick = ()=>showView("viewMe"); return it;
  }
  const item = el("div","user-item glass");
  item.appendChild(avatarFor(uid, u.name));
  const info = el("div","grow");
  const nm = el("div","nm"); nm.appendChild(hl(u.name || "مستخدم", q));
  const em = el("div","em"); em.appendChild(hl(u.username ? "@" + u.username : "", q));
  info.append(nm, em);
  item.append(info, stateButtons(uid, u.name || "المستخدم"));
  item.onclick = ()=>openProfile(uid);
  return item;
}
function scheduleSearch(){
  if(!$("viewSearch").classList.contains("active")) return;
  clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 150);
}
function runSearch(){
  const raw = $("searchInput").value.trim();
  const q = norm(raw.replace(/^@+/, ""));
  $("searchClear").classList.toggle("hidden", !raw);
  const box = $("searchResults"); box.innerHTML = "";
  if(!q){ box.appendChild(el("div","empty","اكتب اسماً أو @معرّفاً للبحث عن الأشخاص ✨")); return; }
  const people = findPeople(q, true).slice(0, 30);
  if(people.length){ box.appendChild(sub("الأشخاص (" + people.length + ")")); people.forEach(([id,u])=>box.appendChild(personRow(id, u, q))); }
  else box.appendChild(el("div","empty", q.length < MIN_Q ? "اكتب حرفين على الأقل للبحث ✨" : !netUp ? "لا يوجد اتصال — البحث عن أشخاص جدد يتطلب إنترنت 📡" : usersState === "loading" ? "جارٍ تحميل المستخدمين…" : usersState === "error" ? "تعذّر قراءة المستخدمين — تحقق من قواعد users في Firebase" : "لا توجد نتائج لـ «" + raw + "»"));
}
$("searchInput").addEventListener("input", scheduleSearch);
$("searchClear").onclick = ()=>{ $("searchInput").value = ""; runSearch(); $("searchInput").focus(); };

/* ═══════ بروفايل الشخص ═══════ */
let profileUid = null, usersState = "loading";
function openProfile(uid){

  profileUid = uid; renderProfile();
  $("profilePanel").querySelector(".pf-body").scrollTop = 0;

}
function closeProfile(){ profileUid = null; $("profilePanel").classList.remove("open"); }
function renderProfile(){
  if(!profileUid) return;
  const u = usersCache[profileUid] || {}, nm = u.name || "مستخدم";

$("pfBack").onclick = closeProfile;
$("pfFriend").onclick = ()=>{ if(profileUid) friendAction(profileUid, nameOf(profileUid), $("pfFriend")); };
$("pfDecline").onclick = ()=>{ if(profileUid) declineRequest(profileUid, $("pfDecline")); };
$("pfChat").onclick = ()=>{ if(!profileUid) return; const id = profileUid, nm = nameOf(id); closeProfile(); openChat(id, nm); };
$("pfStory").onclick = ()=>{ if(profileUid) openStories(profileUid); };
$("pfAvatar").addEventListener("click", ()=>{ if(profileUid && storiesByUser[profileUid] && storiesByUser[profileUid].length) openStories(profileUid); });

function listenUsers(){
  usersRef = db.ref("users");
  usersRef.on("value", snap=>{
    usersCache = {};
    snap.forEach(c=>{
      const x = c.val() || {}, v = {name:x.name, username:x.username, photo:x.photo};   // لا نقرأ البريد أبداً
      if(c.key === me.uid){ if(v.name) me.name = v.name; if(v.username) me.username = v.username; me.photo = v.photo || null; }
      else usersCache[c.key] = v;
    });
    usersState = "ok"; ld.users = true; scheduleCache(); renderMe(); renderChats(); renderStatus(); renderProfile(); renderNotifs(); scheduleSearch();
  }, err=>{ console.error(err); usersState = "error"; scheduleSearch(); });

  friendsRef = db.ref("friends/"+me.uid);
  friendsRef.on("value", s=>{
    friendsSet = s.val() || {}; ld.friends = true; scheduleCache();
    if(chatOther && !friendsSet[chatOther.uid]){ closeChat(); toast("لم تعودا صديقين", "info", "👋"); }
    rebuildStories();                       // الحالات تظهر للأصدقاء فقط
    renderChats(); renderProfile(); scheduleSearch(); updateChatFriendBtn();
  }, err=>console.warn(err));

  reqRef = db.ref("friendRequests/"+me.uid);
  incomingLoaded = false;
  reqRef.on("value", s=>{
    incomingMap = s.val() || {}; incomingLoaded = true; scheduleCache();
    renderChats(); renderNotifs(); renderProfile(); scheduleSearch();
  }, err=>{ console.warn("friendRequests:", err.code || err); incomingLoaded = true; });

  sentRef = db.ref("sentRequests/"+me.uid);
  sentRef.on("value", s=>{
    sentSet = s.val() || {};
    renderChats(); renderProfile(); scheduleSearch();
  }, err=>console.warn("sentRequests:", err.code || err));

  userChatsRef = db.ref("userChats/"+me.uid);
  userChatsRef.on("value", s=>{
    userChatsCache = s.val() || {}; ld.chats = true;
    if(chatOther && $("chatPanel").classList.contains("open") && unreadOf(chatOther.uid)) clearUnread(chatOther.uid);

  }, err=>console.warn(err));
}

/* البحث: لا يظهر أحد إلا عبر البحث (حرفان على الأقل لغير الأصدقاء) */
const MIN_Q = 2;
function findPeople(q, withMe){
  const all = withMe ? {[me.uid]: me, ...usersCache} : usersCache;
  return Object.entries(all)
    .filter(([id,u])=>(id === me.uid || friendsSet[id] || q.length >= MIN_Q) && matchUser(u, q))
    .sort((a,b)=>((!!friendsSet[b[0]]) - (!!friendsSet[a[0]])) || String(a[1].name||"").localeCompare(String(b[1].name||""), "ar"));
}

function renderChats(){
  paintUnread();
  const rawQ = $("chatFilter").value.trim();
  const q = norm(rawQ.replace(/^@+/, ""));
  const req = $("chatReq"), rec = $("chatRecent"), fri = $("chatFriends"), oth = $("chatOthers");
  req.innerHTML = rec.innerHTML = fri.innerHTML = oth.innerHTML = "";

  /* وضع البحث: نتائج المطابقة فقط (الاسم أو @username) */
  if(q){
    const found = findPeople(q, false).slice(0, 30);
    if(found.length){
      oth.appendChild(sub("نتائج البحث (" + found.length + ")"));
      found.forEach(([id,u])=>oth.appendChild(personRow(id, u, q)));
    }else{
      oth.appendChild(el("div","empty",
        q.length < MIN_Q ? "اكتب حرفين على الأقل للبحث عن شخص ✨" :
        !netUp ? "لا يوجد اتصال — البحث عن أشخاص جدد يتطلب إنترنت 📡" :
        usersState === "loading" ? "جارٍ البحث…" :
        usersState === "error" ? "تعذّر قراءة المستخدمين — تحقق من قواعد users" :
        "لا توجد نتائج مطابقة لـ «" + rawQ + "»"));
    }
    return;
  }

  /* الوضع الطبيعي: طلبات الصداقة + آخر المحادثات + الأصدقاء */
  const pend = Object.keys(incomingMap).sort((a,b)=>((incomingMap[b]||{}).ts||0) - ((incomingMap[a]||{}).ts||0));
  if(pend.length){
    req.appendChild(sub("🤝 طلبات الصداقة (" + pend.length + ")"));
    pend.forEach(uid=>{
      const u = usersCache[uid] || {};
      const item = el("div","user-item glass");
      item.appendChild(avatarFor(uid, u.name));
      const info = el("div","grow");
      info.appendChild(nameFor(uid, u.name, "div", "nm"));
      info.appendChild(el("div","last", "يريد أن يكون صديقك"));
      item.append(info, reqButtons(uid));
      item.onclick = ()=>openProfile(uid);
      req.appendChild(item);
    });
  }

  const recents = Object.entries(userChatsCache)
    .filter(([uid,c])=>c && c.ts && friendsSet[uid])
    .sort((a,b)=>b[1].ts - a[1].ts);
  if(recents.length){
    rec.appendChild(sub("آخر المحادثات"));
    recents.forEach(([uid,c])=>{
      const un = unreadOf(uid);
      const item = el("div","user-item glass" + (un ? " has-unread" : ""));
      item.appendChild(avatarFor(uid, nameOf(uid)));
      const info = el("div","grow");
      info.appendChild(nameFor(uid, nameOf(uid), "div", "nm"));
      info.appendChild(el("div","last", (c.from === me.uid ? "أنت: " : "") + (c.text || "")));
      item.append(info, el("div","time", fmtTime(c.ts)));
      if(un) item.appendChild(el("span","unread-badge", un > 99 ? "99+" : String(un)));
      item.onclick = ()=>openChat(uid, nameOf(uid));
      rec.appendChild(item);
    });
  }

  const fr = Object.entries(usersCache).filter(([id])=>friendsSet[id])
    .sort((a,b)=>String(a[1].name||"").localeCompare(String(b[1].name||""), "ar"));
  if(fr.length){ fri.appendChild(sub("أصدقائي (" + fr.length + ")")); fr.forEach(([id,u])=>fri.appendChild(personRow(id, u, ""))); }

  if(!pend.length && !recents.length && !fr.length){
    const em = el("div","empty");
    em.appendChild(el("div", null, "لا توجد محادثات أو أصدقاء بعد 🌠"));
    const hint = el("div","hint","ابحث عن شخص بالاسم أو @username لإضافته ومراسلته"); hint.style.marginTop = "6px";
    const go = el("button","btn","🔍 ابحث الآن"); go.type = "button"; go.style.marginTop = "14px";
    go.onclick = ()=>$("chatFilter").focus();
    em.append(hint, go); oth.appendChild(em);
  }
}
